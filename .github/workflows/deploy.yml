# Pubblica il quiz su GitHub Pages a ogni push su main.
#
# Prerequisito, una sola volta: Settings → Pages → Source: "GitHub Actions".
#
# La build usa --base=./ così i percorsi restano relativi e il sito funziona
# sia in sottocartella (utente.github.io/LifeDesignQuiz/) sia su un dominio
# dedicato, senza dover cambiare configurazione.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vite build --base=./
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
